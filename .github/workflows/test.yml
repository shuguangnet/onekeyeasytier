name: Test scripts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check shell syntax
        run: |
          bash -n easytier.sh
          bash -n install-easytier-node.sh
          bash -n tests/test-installer.sh
          bash -n tests/test-manager.sh

      - name: Test installer
        run: bash tests/test-installer.sh

      - name: Test configuration manager
        run: bash tests/test-manager.sh
